name: Follow Back
on:
  pull_request:
    types: [closed]
permissions:
  pull-requests: write
jobs:
  follow:
    if: github.event.pull_request.merged == true && github.event.pull_request.user.login != 'aixisstudio'
    runs-on: ubuntu-latest
    steps:
      - name: Follow the contributor
        run: |
          curl -s -X PUT -H "Authorization: token ${{ secrets.PAT }}" \
            https://api.github.com/user/following/${{ github.event.pull_request.user.login }}
      - name: Thank + confirm
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({...context.repo,
              issue_number: context.issue.number,
              body: `🎉 Merged! @${context.payload.pull_request.user.login} — you're now followed by @aixisstudio. Welcome to the hub!`});
